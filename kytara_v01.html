<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#161618">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Kytara – stupnice</title>
<style>
html,body{margin:0;height:100%;background:#161618;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#d8d8dc;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;left:0;top:0;right:0;bottom:0;touch-action:none}
#board{position:absolute;left:0;top:0;display:block}
.rot{position:fixed;transform:rotate(90deg);transform-origin:0 0;box-sizing:border-box}
#pin{display:flex;flex-direction:column;gap:.2rem}
.grp{display:flex;flex-direction:column;gap:.1rem}
.lbl{font-size:.21rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#8b8b90;display:flex;align-items:center;gap:.12rem}
.row{display:flex;gap:.09rem}
.grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.08rem}
button.b{height:.78rem;flex:1 1 0;min-width:0;border-radius:.16rem;border:1px solid #38383f;background:#26262a;color:#d8d8dc;font:500 .27rem/1 system-ui,-apple-system,Roboto,sans-serif;padding:0 .04rem;touch-action:manipulation;display:flex;align-items:center;justify-content:center;gap:.06rem;white-space:nowrap;overflow:hidden}
button.b.on{background:#d6d6d9;border-color:#d6d6d9;color:#161618;font-weight:600}
button.b:active{filter:brightness(1.25)}
button.b[disabled]{opacity:.35}
button.b svg{width:.36rem;height:.36rem;flex:none}
.disp{flex:1 1 0;text-align:center;align-self:center;font-size:.28rem;font-weight:600;color:#ececee;white-space:nowrap}
select.sel{height:.78rem;flex:1 1 0;min-width:0;border-radius:.16rem;border:1px solid #38383f;background:#26262a;color:#d8d8dc;font:500 .25rem system-ui,Roboto,sans-serif;padding:0 .1rem}
#beat{width:.18rem;height:.18rem;border-radius:50%;background:#3a3a40;display:inline-block}
#beat.hit{background:#a06ee0}
.arrow{position:fixed;box-sizing:border-box}
.modal{background:#161618;overflow-y:auto;padding:.5rem .55rem;display:flex;flex-direction:column;gap:.28rem;z-index:5}
.modal h2{margin:0;font-size:.4rem;font-weight:700;color:#ececee;display:flex;align-items:center;justify-content:space-between}
.modal h2 small{font-size:.22rem;color:#8b8b90;font-weight:500;margin-left:.15rem}
.modal .note{font-size:.22rem;color:#9a9aa0;line-height:1.35}
.card{width:8.56rem;height:5.398rem;border:2px solid #a06ee0;border-radius:.32rem;box-sizing:border-box;display:flex;align-items:center;justify-content:center;color:#8b8b90;font-size:.24rem;text-align:center;padding:.2rem}
.tunegrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.08rem}
.tunecol{display:flex;flex-direction:column;gap:.06rem;align-items:stretch}
.tunecol .disp{font-size:.26rem;padding:.08rem 0}
.tunecol button.b{flex:none}
#start{z-index:10;background:rgba(10,10,12,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;text-align:center;padding:.6rem}
#start b{font-size:.5rem;color:#ececee}
#start span{font-size:.26rem;color:#9a9aa0;max-width:11rem;line-height:1.4}
#board .fl{stroke:#ffffff;stroke-width:.7;opacity:1}
[hidden]{display:none !important}
</style>
</head>
<body>
<div id="stage"><svg id="board" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div id="panel" class="rot"></div>
<button id="arrL" class="b arrow" aria-label="posunout k tělu"></button>
<button id="arrR" class="b arrow" aria-label="posunout k hlavě"></button>
<div id="settings" class="rot modal" hidden></div>
<div id="start" class="rot"><b>Ťukni kamkoli</b><span>Zapne se zvuk a celá obrazovka.</span></div>
<noscript>Aplikace potřebuje zapnutý JavaScript.</noscript>
<script>
(() => {
'use strict';
const VERSION = 'v01';
const LS = 'kytara.state.v1';
const TAB_W_MM = 236.9;                       // Galaxy Tab S11, šířka displeje na šířku
const STD = [40, 45, 50, 55, 59, 64];         // E2 A2 D3 G3 H3 E4 (MIDI)
const TUNINGS = [
  ['Standard E', [40, 45, 50, 55, 59, 64]],
  ['Drop D', [38, 45, 50, 55, 59, 64]],
  ['Eb standard', [39, 44, 49, 54, 58, 63]],
  ['D standard', [38, 43, 48, 53, 57, 62]],
  ['Drop C', [36, 43, 48, 53, 57, 62]],
];
const SCALES = {
  mpb: {
    name: 'Moll pentatonika + blues', tones: [0, 3, 5, 7, 10], blue: [6],
    // pražce vůči základnímu tónu na struně E ve standardním ladění, struny E A D G H e
    boxes: {
      E: [[0, 3], [0, 2], [0, 2], [0, 2], [0, 3], [0, 3]],
      D: [[3, 5], [2, 5], [2, 5], [2, 4], [3, 5], [3, 5]],
      C: [[5, 7], [5, 7], [5, 7], [4, 7], [5, 8], [5, 7]],
      A: [[7, 10], [7, 10], [7, 9], [7, 9], [8, 10], [7, 10]],
      G: [[10, 12], [10, 12], [9, 12], [9, 12], [10, 12], [10, 12]],
    },
  },
};
const BOX_ORDER = ['E', 'D', 'C', 'A', 'G'];
const BOX_COL = { E: '#c08a4a', D: '#6d93bf', C: '#8fae6a', A: '#b77fa0', G: '#9a8fc7' };
const STRIPE_COL = ['#9a5f55', '#9c8350', '#73885a', '#4f8a83', '#5f739a', '#8a6a94'];
const GAUGE = [1.17, 0.91, 0.66, 0.43, 0.33, 0.25];
const SHARP = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'H'];
const FLAT = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'B', 'H'];
const KEYS = ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'B', 'H'];
const SHARP_ROOTS = new Set([1, 6, 11]);      // C#, F#, H
const INLAY = [3, 5, 7, 9, 12, 15, 17, 19, 21, 24];
const PURPLE = '#a06ee0';
const NF = 24;
const NSTR = 6;
const PW = 30, PICK_HALF = 2.6, SP = 10.5, FRAME_X = PW + 50;

const DEF = {
  mode: 2, root: 11, scale: 'mpb', boxes: ['E'], showScale: true, names: 'root', slide: true, pos: 7, bpm: 80,
  set: { strings: 6, tuningName: 'Standard E', tuning: STD.slice(), scaleLen: 648, nutW: 42, pxmm: 0,
         slideStr: 0.4, legatoStr: 0.5, volume: 0.8 },
};
const S = load();
function load() {
  try {
    const o = JSON.parse(localStorage.getItem(LS) || 'null');
    if (o) return Object.assign({}, JSON.parse(JSON.stringify(DEF)), o, { set: Object.assign({}, DEF.set, o.set || {}) });
  } catch (e) { /* nic */ }
  return JSON.parse(JSON.stringify(DEF));
}
function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { /* nic */ } }

const $ = id => document.getElementById(id);
const board = $('board'), stage = $('stage'), panel = $('panel'), setEl = $('settings');
const mod = (a, n) => ((a % n) + n) % n;
const P = v => (Math.round(v * 100) / 100).toString();

// ---------- geometrie (vše v mm) ----------
let W = 237, H = 148, PX = 5.4, X0 = 0, FRAME_B = 75, MC = 66, ML = 93, MR = 219, MK = 0.25, PANEL_B = 55;
function defaultPx() { return Math.max(screen.width, screen.height) / TAB_W_MM; }
function d(n) { return S.set.scaleLen * (1 - Math.pow(2, -n / 12)); }
function fbEnd() { return d(NF) + 7; }
function fbw(x) { x = Math.max(0, Math.min(x, fbEnd())); return S.set.nutW + 14 * x / d(NF); }
function spread(x) { x = Math.max(0, x); const s0 = S.set.nutW - 7, s1 = 52.5; return s0 + (s1 - s0) * x / S.set.scaleLen; }
function X(x) { return W - (x - X0); }
function xOf(sx) { return X0 + (W - sx); }
function topY(x) { return H - fbw(x); }
function strY(i, x) { x = Math.max(0, x); const c = H - fbw(x) / 2, s = spread(x); return c - s / 2 + i * s / (NSTR - 1); }
function noteX(f) { return f === 0 ? -4.5 : d(f - 1) + 0.58 * (d(f) - d(f - 1)); }
function x0For(p) { return p === 0 ? -14 : d(p - 1) - 3; }
function pMax() { for (let p = 0; p <= NF; p++) if (x0For(p) + W >= fbEnd() + 6) return p; return NF; }
function mh(x) { return fbw(x) * MK * 0.75 / 2; }
function MX(x) { return MR - x * MK; }
function pickY(i) { const ye = Math.max(H - (S.set.nutW + 14) - 25.5, 6 + (NSTR - 1) * SP); return ye - (NSTR - 1 - i) * SP; }
function layout() {
  PX = S.set.pxmm || defaultPx();
  document.documentElement.style.fontSize = (PX * 10) + 'px';   // 1rem = 1 cm
  W = innerWidth / PX; H = innerHeight / PX;
  S.pos = Math.max(0, Math.min(S.pos, pMax()));
  X0 = x0For(S.pos);
  FRAME_B = H - (S.set.nutW + 14) - 17;
  MC = FRAME_B - 8.5;
  ML = FRAME_X + 3 + 8.5 + 2; MR = W - 4 - 3 - 8.5 - 2;
  MK = (MR - ML) / (fbEnd() + 4);
  PANEL_B = MC - mh(fbEnd()) - 5.5;
}

// ---------- hudební logika ----------
function tuning() { return S.set.tuning; }
function nameOf(midi) { return (SHARP_ROOTS.has(S.root) ? SHARP : FLAT)[mod(midi, 12)]; }
function kindOf(i, f) {
  const sc = SCALES[S.scale], iv = mod(tuning()[i] + f - S.root, 12);
  if (iv === 0) return 'root';
  if (sc.tones.includes(iv)) return 'tone';
  if (sc.blue.includes(iv)) return 'blue';
  return null;
}
function boxOccurrences() {
  const sc = SCALES[S.scale], r = mod(S.root - 4, 12), out = [];
  for (const k of BOX_ORDER) {
    if (!S.boxes.includes(k)) continue;
    const def = sc.boxes[k];
    for (const m of [-12, 0, 12, 24]) {
      const lo = [], hi = [];
      let ok = true;
      for (let i = 0; i < NSTR; i++) {
        const off = STD[i] - tuning()[i];
        const a = r + def[i][0] + m + off, b = r + def[i][1] + m + off;
        if (a < 0 || b > NF) { ok = false; break; }
        lo.push(a); hi.push(b);
      }
      if (ok) out.push({ k, lo, hi });
    }
  }
  return out;
}
function scaleNotes(occ) {
  const notes = new Map();
  if (!S.showScale) return notes;
  if (!S.boxes.length) {
    for (let i = 0; i < NSTR; i++) for (let f = 0; f <= NF; f++) { const k = kindOf(i, f); if (k) notes.set(i + '_' + f, k); }
    return notes;
  }
  for (const o of occ) {
    const fmin = Math.min(...o.lo), fmax = Math.max(...o.hi);
    for (let i = 0; i < NSTR; i++) {
      for (const f of [o.lo[i], o.hi[i]]) notes.set(i + '_' + f, kindOf(i, f) || 'tone');
      for (let f = Math.max(0, fmin - 1); f <= Math.min(NF, fmax + 1); f++) {
        if (kindOf(i, f) === 'blue' && !notes.has(i + '_' + f)) notes.set(i + '_' + f, 'blue');
      }
    }
  }
  return notes;
}
function stringLabels() {
  const n = tuning().map(m => FLAT[mod(m, 12)]);
  if (n[NSTR - 1] === n[0]) n[NSTR - 1] = n[NSTR - 1].toLowerCase();
  return n;
}
function posLabel() {
  let last = 0;
  for (let n = 1; n <= NF; n++) if (d(n) <= X0 + W) last = n;
  return `${S.pos}.–${last}. pražec`;
}

// ---------- vykreslení ----------
function txtR(x, y, s, size, fill, weight) {
  return `<text x="${P(x)}" y="${P(y)}" transform="rotate(90 ${P(x)} ${P(y)})" font-size="${size}" font-weight="${weight || 600}" fill="${fill}" text-anchor="middle" dominant-baseline="central">${s}</text>`;
}
function render() {
  layout();
  const o = [];
  board.setAttribute('viewBox', `0 0 ${P(W)} ${P(H)}`);
  board.setAttribute('width', innerWidth); board.setAttribute('height', innerHeight);
  o.push('<defs><linearGradient id="fg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#55595e"/><stop offset=".4" stop-color="#b4b8bd"/><stop offset=".65" stop-color="#eef0f2"/><stop offset="1" stop-color="#5d6166"/></linearGradient></defs>');
  o.push('<g font-family="system-ui,-apple-system,Roboto,sans-serif">');
  const xa = Math.max(0, X0), xb = Math.min(fbEnd(), X0 + W);
  // hlava
  if (X0 < 0) {
    o.push(`<rect x="${P(X(0))}" y="${P(topY(0) - 3)}" width="${P(W - X(0) + 1)}" height="${P(H - topY(0) + 3)}" fill="#2b2b30"/>`);
    o.push(`<rect x="${P(X(0))}" y="${P(topY(0) - 3)}" width="${P(W - X(0) + 1)}" height="1.1" fill="#e3d8bd"/>`);
  }
  // tělo za koncem hmatníku
  if (X0 + W > fbEnd()) {
    const xe = X(fbEnd());
    o.push(`<rect x="-5" y="${P(topY(fbEnd()) - 8)}" width="${P(xe + 5)}" height="${P(H - topY(fbEnd()) + 12)}" rx="6" fill="#111113" stroke="#e3d8bd" stroke-width="0.9"/>`);
  }
  // hmatník
  if (xa < xb) {
    o.push(`<polygon points="${P(X(xb))},${P(topY(xb))} ${P(X(xa))},${P(topY(xa))} ${P(X(xa))},${P(H)} ${P(X(xb))},${P(H)}" fill="#1e1915"/>`);
    for (let k = 0; k < 11; k++) {
      const t = (k + 0.5) / 11, pts = [];
      for (let x = xa; x <= xb + 0.1; x += Math.max(8, (xb - xa) / 24)) {
        const xx = Math.min(x, xb);
        pts.push(`${P(X(xx))},${P(topY(xx) + t * fbw(xx) + 0.45 * Math.sin(xx * 0.043 + k * 1.7))}`);
      }
      o.push(`<polyline points="${pts.join(' ')}" fill="none" stroke="#2c241e" stroke-width="${(0.15 + (k * 37 % 10) / 40).toFixed(2)}" opacity="0.7"/>`);
    }
    o.push(`<polygon points="${P(X(xb))},${P(topY(xb))} ${P(X(xa))},${P(topY(xa))} ${P(X(xa))},${P(topY(xa) + 1.2)} ${P(X(xb))},${P(topY(xb) + 1.2)}" fill="#e3d8bd"/>`);
    o.push(`<rect x="${P(X(xb))}" y="${P(H - 1.2)}" width="${P(X(xa) - X(xb))}" height="1.2" fill="#e3d8bd"/>`);
  }
  // nultý pražec
  if (X0 < 0) o.push(`<rect x="${P(X(0))}" y="${P(topY(0))}" width="3" height="${P(fbw(0))}" fill="#0e0e0f" stroke="#7a7a80" stroke-width="0.3"/>`);
  // pražce
  for (let n = 1; n <= NF; n++) {
    const xn = d(n); if (xn < xa - 2 || xn > xb + 2) continue;
    const yt = topY(xn) + 1.2;
    o.push(`<rect x="${P(X(xn) - 1.2)}" y="${P(yt)}" width="2.4" height="${P(H - 1.2 - yt)}" rx="0.7" fill="url(#fg)"/>`);
  }
  // značky (tečky, na oktávách dvojtečky)
  for (const n of INLAY) {
    const xm = (d(n - 1) + d(n)) / 2, sx = X(xm);
    if (sx < 2 || sx > W - 2) continue;
    const ys = (n === 12 || n === 24) ? [(strY(1, xm) + strY(2, xm)) / 2, (strY(3, xm) + strY(4, xm)) / 2] : [(strY(2, xm) + strY(3, xm)) / 2];
    for (const y of ys) o.push(`<circle cx="${P(sx)}" cy="${P(y)}" r="2.6" fill="#e8e3d6" opacity="0.88"/>`);
  }
  // struny
  for (let i = 0; i < NSTR; i++) {
    const g = Math.max(GAUGE[i], 0.3);
    const pts = [[W, strY(i, X0)]];
    if (X0 < 0) pts.push([X(0), strY(i, 0)]);
    pts.push([0, strY(i, X0 + W)]);
    const p = pts.map(q => `${P(q[0])},${P(q[1])}`).join(' ');
    const ps = pts.map(q => `${P(q[0])},${P(q[1] + 0.45)}`).join(' ');
    o.push(`<polyline points="${ps}" fill="none" stroke="#000" stroke-width="${g}" opacity="0.45"/>`);
    if (i < 3) {
      o.push(`<polyline points="${p}" fill="none" stroke="#b9b3a6" stroke-width="${g}"/>`);
      o.push(`<polyline points="${p}" fill="none" stroke="#6f6a61" stroke-width="${(g * 0.9).toFixed(2)}" stroke-dasharray="0.22 0.3"/>`);
    } else {
      o.push(`<polyline points="${p}" fill="none" stroke="#dfe2e5" stroke-width="${g}"/>`);
    }
  }
  // boxy – obrys přes krajní tóny
  const occ = S.showScale ? boxOccurrences() : [];
  const pos = (i, f) => { const x = noteX(f); return [X(x), strY(i, x)]; };
  for (const b of occ) {
    const pts = [];
    for (let i = 0; i < NSTR; i++) pts.push(pos(i, b.lo[i]));
    for (let i = NSTR - 1; i >= 0; i--) pts.push(pos(i, b.hi[i]));
    if (pts.every(q => q[0] < -5) || pts.every(q => q[0] > W + 5)) continue;
    o.push(`<polygon points="${pts.map(q => P(q[0]) + ',' + P(q[1])).join(' ')}" fill="${BOX_COL[b.k]}" fill-opacity="0.1" stroke="${BOX_COL[b.k]}" stroke-width="0.8" stroke-linejoin="round"/>`);
    const xm = (noteX(Math.min(...b.lo)) + noteX(Math.max(...b.hi))) / 2, sx = X(xm), ty = topY(xm) - 10.5;
    if (sx > 4 && sx < W - 4) {
      o.push(`<rect x="${P(sx - 3.5)}" y="${P(ty - 3)}" width="7" height="6" rx="3" fill="${BOX_COL[b.k]}"/>`);
      o.push(txtR(sx, ty, b.k, 3.8, '#161618', 700));
    }
  }
  // čísla pražců
  for (let n = 1; n <= NF; n++) {
    const xm = (d(n - 1) + d(n)) / 2, sx = X(xm);
    if (sx > 3 && sx < W - 3) o.push(txtR(sx, topY(xm) - 3.6, n, 3.2, '#7c7c82', 500));
  }
  // tóny stupnice
  const notes = scaleNotes(occ);
  const FILL = { tone: '#8e8e93', root: '#d9d9dc', blue: '#68686d' };
  for (const [key, kind] of notes) {
    const [i, f] = key.split('_').map(Number);
    const [sx, sy] = pos(i, f);
    if (sx < 1 || sx > W - 1) continue;
    o.push(`<circle cx="${P(sx)}" cy="${P(sy)}" r="2.9" fill="${FILL[kind]}" stroke="${PURPLE}" stroke-width="0.55"/>`);
    if (S.names === 'all' || (S.names === 'root' && kind === 'root')) {
      o.push(txtR(sx, sy, nameOf(tuning()[i] + f), 3.3, kind === 'root' ? '#161618' : '#f2f2f4', 700));
    }
  }
  // brnkací oblast
  const lab = stringLabels();
  for (let i = 0; i < NSTR; i++) {
    const y = pickY(i);
    o.push(`<rect id="st${i}" x="-4" y="${P(y - 2)}" width="${PW + 4}" height="4" rx="2" fill="${STRIPE_COL[i]}" opacity="0.9"/>`);
    o.push(`<line x1="0" y1="${P(y)}" x2="${PW - 1.5}" y2="${P(y)}" stroke="#d9dbde" stroke-width="${Math.max(GAUGE[i] * 0.8, 0.3).toFixed(2)}" opacity="0.75"/>`);
    o.push(txtR(3.2, y, lab[i], 3.1, '#f0efe9', 700));
  }
  // nastavovací oblast + mapa krku
  o.push(`<rect x="${FRAME_X}" y="2" width="${P(W - 4 - FRAME_X)}" height="${P(FRAME_B - 2)}" rx="3" fill="#1b1b1e" stroke="#4a4a52" stroke-width="0.4"/>`);
  const NL = fbEnd();
  o.push(`<polygon points="${P(MX(NL))},${P(MC - mh(NL))} ${P(MR)},${P(MC - mh(0))} ${P(MR)},${P(MC + mh(0))} ${P(MX(NL))},${P(MC + mh(NL))}" fill="#1e1915" stroke="#e3d8bd" stroke-width="0.4"/>`);
  o.push(`<line x1="${P(MR)}" y1="${P(MC - mh(0))}" x2="${P(MR)}" y2="${P(MC + mh(0))}" stroke="#d8d8d8" stroke-width="1"/>`);
  for (let n = 1; n <= NF; n++) o.push(`<line x1="${P(MX(d(n)))}" y1="${P(MC - mh(d(n)))}" x2="${P(MX(d(n)))}" y2="${P(MC + mh(d(n)))}" stroke="#9a9da1" stroke-width="0.3"/>`);
  for (const n of INLAY) {
    const xm = (d(n - 1) + d(n)) / 2;
    const dys = (n === 12 || n === 24) ? [-mh(xm) * 0.42, mh(xm) * 0.42] : [0];
    for (const dy of dys) o.push(`<circle cx="${P(MX(xm))}" cy="${P(MC + dy)}" r="0.65" fill="#e3dfd4"/>`);
    o.push(txtR(MX(xm), MC - mh(xm) - 2.4, n, 2.6, '#7c7c82', 500));
  }
  for (const b of occ) {
    const pts = [];
    const mp = (i, f) => { const x = noteX(f); return [MX(x), MC + (strY(i, x) - (H - fbw(x) / 2)) * MK * 0.75]; };
    for (let i = 0; i < NSTR; i++) pts.push(mp(i, b.lo[i]));

<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#161618">
<title>Mapa pentatoniky</title>
<style>
  html, body { margin: 0; height: 100%; background: #161618; color: #F1EFE8; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #side { position: absolute; left: 0; top: 0; bottom: 0; width: 200px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px;
    padding: calc(12px + env(safe-area-inset-top)) 0 calc(12px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left)); z-index: 2; }
  #panel { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; flex: none; }
  #panel .wide { grid-column: span 2; }
  .btn { min-height: clamp(46px, 6.5vw, 64px); border-radius: 10px; border: 2px solid #888780; background: #2C2C2A; color: #F1EFE8;
    font: inherit; font-size: clamp(15px, 2.4vw, 20px); font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 3px; line-height: 1.15; }
  .btn small { font-size: clamp(12px, 1.9vw, 16px); font-weight: 400; color: #B4B2A9; }
  #theory { flex: 1; min-height: 0; overflow-y: auto; font-size: clamp(13px, 2.1vw, 18px); line-height: 1.45; color: #D3D1C7; display: none; }
  #theory.open { display: block; }
  #theory h3 { font-size: 1.15em; font-weight: 600; color: #F1EFE8; margin: 0 0 6px; }
  #theory p { margin: 0 0 8px; }
  #theory b { color: #F1EFE8; }
  .btn:active { transform: scale(0.97); }
  #keys { position: absolute; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 5; }
  #keys.open { display: flex; }
  #keysGrid { display: grid; grid-template-columns: repeat(3, 72px); gap: 10px; background: #1f1f1e; padding: 16px; border-radius: 16px; border: 1px solid #444441; }
  #keysGrid .btn { width: 72px; }
  #keysGrid .btn.sel { background: #F1EFE8; color: #2C2C2A; border-color: #F1EFE8; }
  #pages { position: absolute; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 5; }
  #pages.open { display: flex; }
  #pagesBox { display: flex; flex-direction: column; gap: 10px; min-width: 230px; background: #1f1f1e; padding: 16px; border-radius: 16px; border: 1px solid #444441; }
  #pagesBox .btn { text-decoration: none; padding: 3px 16px; }
  #ver { font-size: 12px; color: #5F5E5A; text-align: center; }
</style>
</head>
<body>
<svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="side"><div id="panel"></div><div id="theory"></div></div>
<div id="keys"><div id="keysGrid"></div></div>
<div id="pages"><div id="pagesBox">
  <a class="btn" href="index.html">Trenažér</a>
  <a class="btn" href="kviz.html">Kvíz na boxy</a>
  <a class="btn" href="tony.html">Tóny na hmatníku</a>
  <button class="btn" id="pagesClose" type="button">Zavřít</button>
  <div id="ver"></div>
</div></div>
<script>
'use strict';
// Mapa pentatoniky – verze v06
const VERSION = 'mapa_v06';
const KEYS = ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'B', 'H'];
const OPENS = [40, 45, 50, 55, 59, 64];            // E A D G H e (MIDI)
const FRETS = 24;
const BOXES = [                                    // posun začátku boxu od základního tónu na struně E
  // grip = hmat mollového akordu (tvar Em, Dm, Cm, Am, Gm): pražec na strunách E A D G H e vůči začátku boxu, null = nehraje se
  { id: 'E', off: 0,  col: '#D85A30', grip: [0, 2, 2, 0, 0, 0] },
  { id: 'D', off: 3,  col: '#378ADD', grip: [null, null, -1, 1, 2, 0] },
  { id: 'C', off: 5,  col: '#1D9E75', grip: [null, 2, 0, -1, 0, 2] },
  { id: 'A', off: 7,  col: '#7F77DD', grip: [null, 0, 2, 2, 1, 0] },
  { id: 'G', off: 10, col: '#D4537E', grip: [2, 0, -1, -1, 2, 2] },
];
const CHORD_IV = { 0: '1', 3: 'b3', 7: '5' };       // tóny mollového akordu tóniny
const CHORD_MODES = ['off', 'int', 'name'];

const state = { key: 11, boxes: ['E'], blues: true, all: true, chord: 'off' };
try { Object.assign(state, JSON.parse(localStorage.getItem('mapa-state') || '{}')); } catch (e) {}
function save() { try { localStorage.setItem('mapa-state', JSON.stringify(state)); } catch (e) {} }

const scaleSet = () => new Set([0, 3, 5, 7, 10].map(i => (state.key + i) % 12));
const bluesPc = () => (state.key + 6) % 12;

// Tóny boxu: na každé struně dva sousední tóny stupnice, navazující na předchozí strunu.
function boxFrets(start) {
  const sc = scaleSet();
  const next = p => { p++; while (!sc.has(p % 12)) p++; return p; };
  let p = OPENS[0] + start; const lo = [], hi = [];
  OPENS.forEach((o, i) => {
    if (i > 0) p = next(p);
    const l = p, u = next(l);
    lo.push(l - o); hi.push(u - o); p = u;
  });
  return { lo, hi };
}
function boxInstances(b) {
  const base = ((state.key - 4 + 12) % 12) + b.off;
  const out = [];
  for (let s = base - 24; s <= FRETS; s += 12) {
    const f = boxFrets(s);
    if (Math.min(...f.lo) >= 0 && Math.max(...f.hi) <= FRETS) { f.start = s; out.push(f); }
  }
  return out;
}

// ---------- ovládání ----------
const panel = document.getElementById('panel');
function mkBtn(html, onClick) {
  const b = document.createElement('button'); b.className = 'btn'; b.innerHTML = html;
  b.addEventListener('click', onClick); panel.appendChild(b); return b;
}
const keyBtn = mkBtn('', () => openKeys()); keyBtn.classList.add('wide');
const boxBtns = BOXES.map(b => {
  const el = mkBtn('Box ' + b.id, () => {
    const i = state.boxes.indexOf(b.id);
    if (i >= 0) state.boxes.splice(i, 1); else state.boxes.push(b.id);
    update();
  });
  return { b, el };
});
const bluesBtn = mkBtn('', () => { state.blues = !state.blues; update(); });
const allBtn = mkBtn('', () => { state.all = !state.all; update(); });
const chordBtn = mkBtn('', () => {
  state.chord = CHORD_MODES[(CHORD_MODES.indexOf(state.chord) + 1) % CHORD_MODES.length]; update();
});

// odkazy na ostatní stránky
const pagesEl = document.getElementById('pages');
mkBtn('Stránky', () => pagesEl.classList.add('open')).classList.add('wide');
pagesEl.addEventListener('click', e => { if (e.target === pagesEl || e.target.id === 'pagesClose') pagesEl.classList.remove('open'); });
document.getElementById('ver').textContent = VERSION;

const keysEl = document.getElementById('keys'), keysGrid = document.getElementById('keysGrid');
KEYS.forEach((k, i) => {
  const b = document.createElement('button'); b.className = 'btn'; b.textContent = k;
  b.addEventListener('click', e => { e.stopPropagation(); state.key = i; keysEl.classList.remove('open'); update(); });
  keysGrid.appendChild(b);
});
keysEl.addEventListener('click', () => keysEl.classList.remove('open'));
function openKeys() {
  [...keysGrid.children].forEach((b, i) => b.classList.toggle('sel', i === state.key));
  keysEl.classList.add('open');
}

function updateButtons() {
  keyBtn.innerHTML = 'Tónina<small>' + KEYS[state.key] + ' moll</small>';
  boxBtns.forEach(({ b, el }) => {
    const on = state.boxes.includes(b.id);
    el.style.borderColor = b.col;
    el.style.background = on ? b.col : '#2C2C2A';
    el.style.color = on ? '#ffffff' : b.col;
  });
  bluesBtn.innerHTML = 'Blues<small>' + (state.blues ? 'zap' : 'vyp') + '</small>';
  allBtn.innerHTML = 'Tóny<small>' + (state.all ? 'všechny' : 'v boxech') + '</small>';
  chordBtn.innerHTML = 'Akord<small>' + ({ off: 'vyp', int: '1 b3 5', name: 'názvy' })[state.chord] + '</small>';
  chordBtn.style.borderColor = state.chord === 'off' ? '#888780' : '#F1EFE8';
  updateTheory();
}

// ---------- teorie (ukazuje se při zobrazení intervalů) ----------
const theory = document.getElementById('theory');
function updateTheory() {
  theory.classList.toggle('open', state.chord === 'int');
  if (state.chord !== 'int') return;
  const n = i => '<b>' + KEYS[(state.key + i) % 12] + '</b>';
  theory.innerHTML = `
    <h3>Co znamenají čísla</h3>
    <p><b>Půltón</b> = posun o 1 pražec. Interval říká, o kolik půltónů je tón výš než základní tón.</p>
    <p><b>1 – základní tón</b> (${n(0)}). Podle něj se jmenuje tónina i akord.</p>
    <p><b>b3 – malá tercie</b> (${n(3)}), 3 půltóny nad 1. Tercie = třetí tón stupnice, „b“ = snížená. Malá tercie dělá akord <b>mollový</b> (smutný zvuk).
      Velká tercie (3) má 4 půltóny a dělá akord <b>durový</b> (veselý).</p>
    <p><b>5 – kvinta</b> (${n(7)}), 7 půltónů nad 1. Kvinta = pátý tón stupnice. Je stejná v mollu i v duru a dává akordu pevnost. Samotné 1 + 5 je „power chord“.</p>
    <p><b>Akord ${KEYS[state.key]}m = 1 + b3 + 5</b> (${n(0)}, ${n(3)}, ${n(7)}). Durový akord = 1 + 3 + 5.</p>
    <p><b>Šedé tečky bez kroužku</b> jsou zbylé tóny pentatoniky: <b>4</b> – kvarta (${n(5)}, 5 půltónů) a <b>b7</b> – malá septima (${n(10)}, 10 půltónů). Křížek je bluesový tón <b>b5</b> (${n(6)}, 6 půltónů).</p>
    <p><b>Na krku:</b> b3 je na stejné struně o 3 pražce výš než 1. Kvinta je na sousední tenčí struně o 2 pražce výš (u přechodu ze struny G na H o 3).</p>
    <p><b>Kroužek plný</b> = tón z hmatu akordu daného tvaru, <b>čárkovaný</b> = další tón akordu v boxu.</p>`;
}

// ---------- kreslení krku ----------
const svg = document.getElementById('map');
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  (parent || svg).appendChild(e); return e;
}

function draw() {
  const W = window.innerWidth, H = window.innerHeight;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = '';

  const padTop = 30, padBot = 14;
  const top = padTop, L = (H - padTop - padBot) / 0.75;      // skutečné rozestupy pražců
  const fy = n => top + L * (1 - Math.pow(2, -n / 12));
  const ny = n => n === 0 ? top - 13 : (fy(n - 1) + fy(n)) / 2;

  // krk vpravo (vedle něj písmena boxů), vlevo tlačítka a teorie
  const neckW = Math.min(W * 0.32, 260);
  const x1 = W - 40, x0 = x1 - neckW, cx = (x0 + x1) / 2;
  document.getElementById('side').style.width = Math.max(150, x0 - 36) + 'px';
  const inset = neckW * 0.09;
  const sx = i => x0 + inset + i * (neckW - 2 * inset) / 5;

  // hmatník, pražce, struny
  el('rect', { x: x0, y: top, width: neckW, height: fy(FRETS) - top, fill: '#141414', stroke: '#444441' });
  for (let n = 1; n <= FRETS; n++) el('line', { x1: x0, y1: fy(n), x2: x1, y2: fy(n), stroke: '#888780', 'stroke-width': 1 });
  el('line', { x1: x0, y1: top, x2: x1, y2: top, stroke: '#D3D1C7', 'stroke-width': 3 });
  // značky na hmatníku a čísla pražců vlevo od krku
  [3, 5, 7, 9, 12, 15, 17, 19, 21, 24].forEach(n => {
    const y = ny(n), room = fy(n) - fy(n - 1);
    const r = Math.max(3, Math.min(9, room * 0.28, neckW / 14));
    const xs = (n === 12 || n === 24) ? [(sx(1) + sx(2)) / 2, (sx(3) + sx(4)) / 2] : [cx];
    xs.forEach(x => el('circle', { cx: x, cy: y, r, fill: '#3D3D3A' }));
    el('text', { x: x0 - 8, y: y + 5, 'text-anchor': 'end', fill: '#B4B2A9', 'font-size': 14 }, null, n);
  });
  for (let i = 0; i < 6; i++) el('line', { x1: sx(i), y1: top - 24, x2: sx(i), y2: fy(FRETS), stroke: '#B4B2A9', 'stroke-width': (1.9 - i * 0.27).toFixed(2) });

  // boxy
  const sc = scaleSet(), bl = bluesPc();
  const shown = BOXES.filter(b => state.boxes.includes(b.id));
  const inBox = new Set();
  const chordAt = new Map();                       // 'struna:pražec' -> { col, grip }
  const gBox = el('g', {});
  shown.forEach(b => {
    boxInstances(b).forEach(f => {
      const pts = [];
      for (let i = 0; i < 6; i++) pts.push([sx(i), ny(f.lo[i])]);
      for (let i = 5; i >= 0; i--) pts.push([sx(i), ny(f.hi[i])]);
      el('path', { d: 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' L') + ' Z',
        fill: 'none', stroke: b.col, 'stroke-width': 3, 'stroke-linejoin': 'round' }, gBox);
      const ym = (ny(Math.min(...f.lo)) + ny(Math.max(...f.hi))) / 2;
      el('text', { x: x1 + 14, y: ym + 7, fill: b.col, 'font-size': 20, 'font-weight': 500 }, gBox, b.id);
      for (let i = 0; i < 6; i++) for (let n = f.lo[i]; n <= f.hi[i]; n++) {
        inBox.add(i + ':' + n);
        const iv = ((OPENS[i] + n) % 12 - state.key + 12) % 12;
        if (state.chord !== 'off' && iv in CHORD_IV) {
          const g = b.grip[i] != null && f.start + b.grip[i] === n;
          const c = chordAt.get(i + ':' + n) || { cols: [], grip: false };
          if (!c.cols.includes(b.col)) c.cols.push(b.col);
          c.grip = c.grip || g;
          chordAt.set(i + ':' + n, c);
        }
      }
    });
  });

  // tóny
  const gN = el('g', {});
  const labels = [];
  for (let i = 0; i < 6; i++) {
    for (let n = 0; n <= FRETS; n++) {
      const pc = (OPENS[i] + n) % 12;
      const isBlues = pc === bl, isScale = sc.has(pc);
      if (!isScale && !(isBlues && state.blues)) continue;
      if (!state.all && !inBox.has(i + ':' + n)) continue;
      const x = sx(i), y = ny(n);
      const room = n === 0 ? 26 : fy(n) - fy(n - 1);
      const r = Math.max(3.5, Math.min(7, room * 0.3, neckW / 22));
      const ch = chordAt.get(i + ':' + n);
      if (ch) {
        // tón akordu: kroužek v barvě boxu (plný = hmat akordu, čárkovaný = jiný tón akordu v boxu), popisek bokem
        const iv = (pc - state.key + 12) % 12;
        const label = state.chord === 'int' ? CHORD_IV[iv] : KEYS[pc];
        const rr = Math.max(7, Math.min(11, room * 0.4));
        el('circle', { cx: x, cy: y, r: Math.min(r, rr - 3), fill: '#B4B2A9' }, gN);
        const ring = { fill: 'none', 'stroke-width': ch.grip ? 3 : 2 };
        if (!ch.grip) ring['stroke-dasharray'] = '3 2.5';
        if (ch.cols.length === 1) el('circle', Object.assign({ cx: x, cy: y, r: rr, stroke: ch.cols[0] }, ring), gN);
        else {                                       // tón patří dvěma sousedním boxům: půlka kroužku v každé barvě
          el('path', Object.assign({ d: `M${x},${y - rr} A${rr},${rr} 0 0 0 ${x},${y + rr}`, stroke: ch.cols[0] }, ring), gN);
          el('path', Object.assign({ d: `M${x},${y - rr} A${rr},${rr} 0 0 1 ${x},${y + rr}`, stroke: ch.cols[1] }, ring), gN);
        }
        labels.push({ x: x + rr * 0.75, y: y - rr * 0.75, label, col: ch.cols[ch.cols.length - 1] });
      } else if (isBlues) {
        const k = r * 0.9;
        el('path', { d: `M${x - k},${y - k} L${x + k},${y + k} M${x + k},${y - k} L${x - k},${y + k}`, stroke: '#F1EFE8', 'stroke-width': 2 }, gN);
      } else if (pc === state.key) {
        const rr = Math.max(8, Math.min(11, room * 0.45));
        el('circle', { cx: x, cy: y, r: rr, fill: '#F1EFE8' }, gN);
        el('text', { x, y: y + rr * 0.42, 'text-anchor': 'middle', fill: '#2C2C2A', 'font-size': Math.max(11, rr * 1.15), 'font-weight': 600 }, gN, KEYS[state.key]);
      } else {
        el('circle', { cx: x, cy: y, r, fill: '#888780' }, gN);
      }
    }
  }
  const gL = el('g', {});                            // popisky nahoře, s tmavým lemem kvůli čitelnosti
  labels.forEach(l => el('text', { x: l.x, y: l.y, fill: '#ffffff', stroke: '#141414', 'stroke-width': 3,
    'paint-order': 'stroke', 'font-size': 12, 'font-weight': 700 }, gL, l.label));
}

function update() { updateButtons(); save(); draw(); }
window.addEventListener('resize', draw);
update();
</script>
</body>
</html>
